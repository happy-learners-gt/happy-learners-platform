name: Platform delivery

on:
  # «labeled» lets a pull request ask for its preview by getting the «vista-previa» label.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  # Production is checked after every deployment; the daily run only confirms it is still serving (DEC-044 FinOps).
  schedule:
    - cron: '17 13 * * *'
  # Documentation does not reach the Worker: a docs-only commit keeps the deployed product SHA.
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']

permissions:
  contents: read

# A new push to a pull request replaces its unfinished run; runs on main are never cancelled.
concurrency:
  group: delivery-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The parents of a merge commit, to compare it with the pull request it merged.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      # A push to main that merges a pull request already up to date with main has the same tree as the pull
      # request's head. If that head passed this whole workflow (verify, E2E and preview), the checks are not run
      # again: the package is only rebuilt, because it carries the SHA of main. Any other push runs everything.
      - name: Reuse the pull request's verification
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reused=false
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" = 3 ] && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ]; then
            head="$(git rev-parse 'HEAD^2')"
            passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head&event=pull_request&status=success&per_page=20" \
              --jq '[.workflow_runs[] | select(.path == ".github/workflows/repository.yml")] | length')"
            if [ "$passed" -gt 0 ]; then
              reused=true
              echo "Verificación reutilizada del PR (commit $head, mismo árbol que $GITHUB_SHA)." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "reused=$reused" >> "$GITHUB_OUTPUT"
      - name: Build the package for this SHA
        if: steps.reuse.outputs.reused == 'true'
        run: npm run build && npx --no-install wrangler deploy --dry-run --config build/wrangler.json
      - if: steps.reuse.outputs.reused != 'true'
        run: ./scripts/verify
      - if: steps.reuse.outputs.reused != 'true'
        run: npx --no-install playwright install --with-deps chromium
      # Desktop and mobile run at once, each against its own local server and new database, so the job takes about
      # half as long and each server stays well inside the 30-sign-ins limit.
      - name: E2E (desktop and mobile in parallel)
        if: steps.reuse.outputs.reused != 'true'
        run: |
          HL_E2E_PORT=8789 HL_E2E_RESULTS=.release-evidence/e2e-desktop.json npx --no-install playwright test --project=desktop > e2e-desktop.log 2>&1 & desktop=$!
          HL_E2E_PORT=8790 HL_E2E_RESULTS=.release-evidence/e2e-mobile.json npx --no-install playwright test --project=mobile > e2e-mobile.log 2>&1 & mobile=$!
          status=0
          wait "$desktop" || status=1
          wait "$mobile" || status=1
          grep -v "^\[WebServer\]" e2e-desktop.log
          grep -v "^\[WebServer\]" e2e-mobile.log
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: demo-${{ github.sha }}
          path: build/
          if-no-files-found: error
          retention-days: 7

  # Pull requests from this repository get an isolated preview: separate Worker, Durable Objects and
  # R2 bucket, deployed from the verified artifact, then checked with the read-only smoke suite.
  # Only on request (label «vista-previa»): the preview reads from the same Cloudflare account as production, and the
  # free plan allows 5 million Durable Object rows read a day (on 30 Oct 2026 CI used them up and production stopped).
  preview:
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'vista-previa')
    runs-on: ubuntu-latest
    concurrency:
      group: demo-preview
      cancel-in-progress: false
    env:
      PREVIEW_URL: https://happy-learners-demo-preview.lfmendoza-alvarez.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: demo-${{ github.sha }}
          path: build/
      # ST-189: only what passed the security scanners in its pull request reaches production (scripts/security-gate.py).
      - name: Security gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/security-gate.py
      - name: Confirm artifact version
        run: node scripts/verify-artifact.mjs
      - name: Isolate preview configuration
        run: node scripts/preview-config.mjs
      - name: Ensure private preview bucket exists
        run: |
          bucket="happy-learners-demo-preview-files"
          listed="$(npx --no-install wrangler r2 bucket list --config build/wrangler.json)"
          if ! grep -Fq "$bucket" <<< "$listed"; then
            npx --no-install wrangler r2 bucket create "$bucket" --config build/wrangler.json
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy preview
        run: npx --no-install wrangler deploy --config build/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx --no-install playwright install --with-deps chromium
      - name: Preview smoke
        run: npm run test:smoke
        env:
          BASE_URL: ${{ env.PREVIEW_URL }}
          EXPECTED_SHA: ${{ github.sha }}
      - name: Publish preview URL
        if: always()
        run: echo "Preview ${PREVIEW_URL} · SHA ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-evidence-${{ github.sha }}
          path: .release-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  deploy:
    permissions:
      contents: read
      deployments: write
      actions: read
      pull-requests: read
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: demo-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: demo-${{ github.sha }}
          path: build/
      # ST-189: only what passed the security scanners in its pull request reaches production (scripts/security-gate.py).
      - name: Security gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/security-gate.py
      - name: Confirm artifact version
        run: node scripts/verify-artifact.mjs
      - name: Record deployment start
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deployment-event.py start
      - name: Ensure private course-file bucket exists
        id: bucket
        run: |
          bucket="happy-learners-demo-course-files"
          listed="$(npx --no-install wrangler r2 bucket list --config build/wrangler.json)"
          if ! grep -Fq "$bucket" <<< "$listed"; then
            npx --no-install wrangler r2 bucket create "$bucket" --config build/wrangler.json
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy verified package
        id: cloudflare
        run: npx --no-install wrangler deploy --config build/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Record deployment result
        if: always() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          DEPLOY_OUTCOME: ${{ steps.cloudflare.outcome == 'skipped' && steps.bucket.outcome || steps.cloudflare.outcome }}
        run: python3 scripts/deployment-event.py finish

  critical-flows:
    permissions:
      contents: read
      deployments: read
    needs: deploy
    if: always() && (github.event_name == 'schedule' || needs.deploy.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      # The scheduled check expects the SHA of the last successful deployment, not the head of main.
      - name: Resolve deployed SHA
        id: expected
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          sha="$GITHUB_SHA"
          if [ "$EVENT" = schedule ]; then
            sha=""
            for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=demo&per_page=30" --jq '.[].id'); do
              if [ "$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state')" = success ]; then
                sha="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq .sha)"
                break
              fi
            done
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "No successful demo deployment found" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - run: node scripts/critical-flows.mjs
        env:
          BASE_URL: https://happy-learners-demo.lfmendoza-alvarez.workers.dev
          EXPECTED_SHA: ${{ steps.expected.outputs.sha }}
      # The critical flows are the check after a deployment; the full smoke suite runs only in a requested preview,
      # to keep within the Durable Object reads of the free plan.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-evidence-${{ github.sha }}
          path: .release-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
