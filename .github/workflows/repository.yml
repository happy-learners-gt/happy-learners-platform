name: Platform delivery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: ./scripts/verify
      - uses: actions/upload-artifact@v4
        with:
          name: demo-${{ github.sha }}
          path: build/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: demo-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: demo-${{ github.sha }}
          path: build/
      - name: Confirm artifact version
        run: node --input-type=module -e "import fs from 'node:fs'; if (JSON.parse(fs.readFileSync('build/version.json')).sha !== process.env.GITHUB_SHA) process.exit(1)"
      - name: Deploy verified package
        run: npx --no-install wrangler deploy --config build/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
